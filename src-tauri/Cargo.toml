[package]
name = "nova"
version = "0.1.0"
description = "A local-first AI companion desktop application"
authors = ["Nova contributors"]
edition = "2024"
rust-version = "1.98.1"

[lib]
name = "nova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "0.22.1"
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "multipart", "native-tls"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["cache"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-notification = "2"
thiserror = "2.0.20"

[dev-dependencies]
tempfile = "3.23.0"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
